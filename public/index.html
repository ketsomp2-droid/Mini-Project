<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Reading List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📚 My Reading List</h1>
    <p>จัดการหนังสือที่อยากอ่าน กำลังอ่าน และอ่านจบแล้ว</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">เพิ่มหนังสือใหม่</h2>
      <form id="book-form">
        <input type="hidden" id="book-id" />
        <label>ชื่อหนังสือ *
          <input type="text" id="title" required />
        </label>
        <label>ผู้แต่ง *
          <input type="text" id="author" required />
        </label>
        <label>หมวดหมู่
          <input type="text" id="category" placeholder="เช่น Programming" />
        </label>
        <label>สถานะ
          <select id="status">
            <option value="want-to-read">อยากอ่าน</option>
            <option value="reading">กำลังอ่าน</option>
            <option value="finished">อ่านจบแล้ว</option>
          </select>
        </label>
        <label>คะแนน (0-5)
          <input type="number" id="rating" min="0" max="5" value="0" />
        </label>
        <div class="actions">
          <button type="submit" id="submit-btn">เพิ่มหนังสือ</button>
          <button type="button" id="cancel-btn" class="secondary hidden">ยกเลิก</button>
        </div>
        <p id="message" class="message"></p>
      </form>
    </section>

    <section>
      <div class="toolbar">
        <input type="search" id="search" placeholder="ค้นหาชื่อหรือผู้แต่ง..." />
        <select id="filter-status">
          <option value="">ทุกสถานะ</option>
          <option value="want-to-read">อยากอ่าน</option>
          <option value="reading">กำลังอ่าน</option>
          <option value="finished">อ่านจบแล้ว</option>
        </select>
      </div>
      <div id="book-list" class="grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
